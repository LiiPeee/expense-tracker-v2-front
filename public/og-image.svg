<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea875"/>
      <stop offset="52%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.06"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="150" cy="120" r="280" fill="white" fill-opacity="0.05"/>
  <circle cx="1100" cy="520" r="320" fill="white" fill-opacity="0.05"/>

  <!-- Card -->
  <rect x="80" y="160" width="480" height="310" rx="24" fill="url(#card)" stroke="white" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Logo circle -->
  <rect x="120" y="210" width="72" height="72" rx="18" fill="white" fill-opacity="0.2"/>
  <text x="156" y="259" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">F</text>

  <!-- App name -->
  <text x="120" y="324" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white">Controle Financeiro</text>
  <text x="120" y="358" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.75">Gerencie suas finanças com clareza e controle</text>

  <!-- Stats row -->
  <rect x="120" y="390" width="120" height="56" rx="12" fill="white" fill-opacity="0.12"/>
  <text x="180" y="413" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.7" text-anchor="middle">Receitas</text>
  <text x="180" y="435" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#4ade80" text-anchor="middle">+ R$ 5.000</text>

  <rect x="254" y="390" width="120" height="56" rx="12" fill="white" fill-opacity="0.12"/>
  <text x="314" y="413" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.7" text-anchor="middle">Despesas</text>
  <text x="314" y="435" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#f87171" text-anchor="middle">- R$ 3.200</text>

  <rect x="388" y="390" width="120" height="56" rx="12" fill="white" fill-opacity="0.12"/>
  <text x="448" y="413" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.7" text-anchor="middle">Economia</text>
  <text x="448" y="435" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">R$ 1.800</text>

  <!-- Right side decorative chart bars -->
  <g transform="translate(700, 160)">
    <rect x="0"   y="200" width="44" height="110" rx="8" fill="white" fill-opacity="0.18"/>
    <rect x="56"  y="140" width="44" height="170" rx="8" fill="white" fill-opacity="0.25"/>
    <rect x="112" y="80"  width="44" height="230" rx="8" fill="white" fill-opacity="0.32"/>
    <rect x="168" y="120" width="44" height="190" rx="8" fill="white" fill-opacity="0.25"/>
    <rect x="224" y="60"  width="44" height="250" rx="8" fill="white" fill-opacity="0.38"/>
    <rect x="280" y="100" width="44" height="210" rx="8" fill="white" fill-opacity="0.28"/>
    <rect x="336" y="40"  width="44" height="270" rx="8" fill="white" fill-opacity="0.45"/>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.55" text-anchor="middle">budgettracker-kso8.onrender.com</text>
</svg>
